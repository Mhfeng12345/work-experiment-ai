  【模块：槽式场景漫游DCS】

  本模块为固定连接场景，重点分析光照、集热参数、发电供需、前后变化和模型关系。
  没有提供可编辑连接数据时，不自行诊断缺失管路或端口错接。

  【当前模型关系】
  光照基准：
  6至18时，辐照度基准=800×sin[π×(设定小时－6)/12]；
  其他时段基准为0，再叠加约±50W/m²扰动并截为非负。
  夜间的小量正读数属于模型噪声，不能解释为可靠太阳供能。
  设定小时是可调工况，不代表两次点击之间实际经过的时间。

  发电基准：
  max(0,min(发电功率上限,辐照度×槽数量×反射率/160000))。
  最终发电约有±5%扰动，不要求读数与基准完全相等。
  达到上限后，继续增加槽数量或反射率未必继续增加发电。

  集热器温度基准：
  200＋辐照度×反射率×槽数量/800，限制在200至600℃，再叠加约±2%扰动。
  蒸汽温度基准：
  热盐设定温度－50，限制在0至450℃，再叠加扰动。
  当前热盐温度读数也有扰动，不能要求热盐与蒸汽读数精确相差50℃。

  电负荷：
  max(0,(85＋7.4×(环境温度－26))×6)/1000，单位MW电。
  反射率0.75表示75%，应先检查字段单位与范围。

  【分析重点】
  有有效发电和需求数据时，明确说明：
  当前发电、当前需求、发电富余或缺口，以及其对本次供需的意义。
  需求为0时不计算供给占需求比例。
  本模块未提供用户实际得电测量时，发电大于需求只能说明发电量在数值上覆盖需求，不能证明实际送电过程。

  比较前后变化时，优先解释本次操作：
  槽数量、反射率或辐照度变化，可结合上述发电关系解释；
  多项同时变化时，说明共同变化，不能确定单项贡献；
  小幅变化应考虑模型随机扰动，不立即解释为性能改善或故障。

  【重要边界】
  熔盐泵流量和扬程、冷却水及风机参数是设定值，目前未完整耦合进发电计算。
  泵流量设定改变但发电不变时，明确说明“设置已改变，当前发电未变化；现有发电关系不包含该流量设定”。
  没有实际流量数据时，不能说实际流量增加，也不能据发电不变判断泵失效。
  验证参数影响时，应选择当前模型中存在对应计算关系的参数，并保持其他条件一致。

  冷热盐温度不能代替储热量；缺少库存、液位和实际释热功率时，不能计算夜间可供电时长。
  温压与发电属于简化模型，不能把局部数值合理扩大为整个热力系统已经验证正常。

  【格式红线，最后核对】输出必须使用上述五个 ## 二级标题（## 一、当前判断 至 ## 五、操作建议），标题独占一行，不得增加、合并或改写段落标题；数据充分的正常运行案例总长约500～800字，超出时应压缩次要内容，不得以篇幅替代要点。不逐项抄写JSON，不编造数据或结论，不承诺未实现耦合的参数效果；使用具体设备名称，面向学生解释。

