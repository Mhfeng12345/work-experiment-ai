# 内网 Runner 部署：从 GHCR 拉取镜像 → 重建容器
# 0.2.5 起不再本地构建（云端 docker-ghcr.yml 负责构建推送），也不依赖 LAN mirror git daemon。
# GHCR 镜像公开（ghcr.io/mhfeng12345/work-experiment-ai），pull 无需登录/PAT。
# 版本号从镜像 ENV APP_VERSION 读取（无需 checkout 仓库）。
# 触发：push 到默认分支 / 手动。

name: Deploy Experiment AI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-ai-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Pull image from GHCR (mirror + retry)
        run: |
          IMAGE="mhfeng12345/work-experiment-ai:latest"
          # 国内镜像站（代理任意 GHCR 镜像）优先，ghcr.io 直连兜底；各 3 次
          for REG in ghcr.nju.edu.cn ghcr.dockerproxy.net ghcr.io; do
            for TRY in 1 2 3; do
              echo "尝试 [$REG] 第${TRY}次: ${REG}/${IMAGE}"
              if docker pull "${REG}/${IMAGE}"; then
                echo "PULL_OK=${REG}/${IMAGE}"
                docker tag "${REG}/${IMAGE}" "ghcr.io/${IMAGE}"
                exit 0
              fi
              echo "失败，3s 后重试"
              sleep 3
            done
          done
          echo "所有源均失败" && exit 1

      - name: Resolve image version and tag
        run: |
          IMAGE="ghcr.io/mhfeng12345/work-experiment-ai:latest"
          VER=$(docker image inspect "${IMAGE}" --format '{{range .Config.Env}}{{println .}}{{end}}' \
                | grep -oP 'APP_VERSION=\K[0-9.]+' | head -1)
          echo "APP_VERSION=${VER}"
          docker tag "${IMAGE}" experiment-ai:latest
          docker tag "${IMAGE}" "experiment-ai:${VER}"

      - name: Update container
        run: |
          docker compose -f /home/wdzm71/docker-compose.yml up -d --no-deps --force-recreate experiment-ai

      - name: Verify deployment
        run: |
          docker compose -f /home/wdzm71/docker-compose.yml ps experiment-ai
