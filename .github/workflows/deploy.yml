# 内网 Runner 部署：从 GHCR 拉取镜像 → 重建容器
# 0.2.5 起不再本地构建（云端 docker-ghcr.yml 负责构建推送）。
# 依赖：仓库 Secrets 配 GHCR_PAT（read:packages 的 PAT，用于 docker login ghcr.io）。
# 触发：push 到默认分支 / 手动。镜像 tag 从 Dockerfile 的 APP_VERSION 读取。

name: Deploy Experiment AI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experiment-ai-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout source (LAN mirror)
        run: |
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -delete
          git clone --depth 1 git://192.168.0.50:9418/experiment-ai .

      - name: Resolve image version
        id: ver
        run: |
          echo "APP_VERSION=$(grep -oP 'APP_VERSION=\K[0-9.]+' Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image from GHCR
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.APP_VERSION }}"
          echo "拉取镜像: ${IMAGE}"
          docker pull "${IMAGE}"
          docker tag "${IMAGE}" experiment-ai:latest
          docker tag "${IMAGE}" "experiment-ai:${{ steps.ver.outputs.APP_VERSION }}"

      - name: Update container
        run: |
          docker compose -f /home/wdzm71/docker-compose.yml up -d --no-deps --force-recreate experiment-ai

      - name: Verify deployment
        run: |
          docker compose -f /home/wdzm71/docker-compose.yml ps experiment-ai
